<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Four Books Funnel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1f5c;--bg2:#06133b;--gold:#e8c25a;--gold2:#fff1b8;--card:#10307f;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(var(--bg),var(--bg2));color:var(--tx);font-family:'Noto Nastaliq Urdu','Poppins',serif;line-height:2}
html[lang=en] body{font-family:'Poppins',sans-serif;line-height:1.6}
.w{max-width:1050px;margin:auto;padding:20px 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#06133bee;border-bottom:1px solid var(--gold);display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
button{font-family:inherit;cursor:pointer}
.tg,.cb{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 14px}
.seg{display:flex;border:1px solid var(--gold);border-radius:22px;overflow:hidden}.seg button{background:none;border:0;color:var(--gold);padding:5px 16px;font-size:.95rem}.seg button.on{background:var(--gold);color:#0a1f5c;font-weight:700}
.gold{background:linear-gradient(135deg,#b88a1c,var(--gold),var(--gold2),var(--gold));color:#0a1f5c;border:0;border-radius:12px;padding:10px 22px;font-weight:700;font-size:1rem}
.hero{text-align:center;padding-top:30px}
.hero h1{font-size:clamp(1.6rem,5vw,2.8rem);margin:0;color:var(--gold);line-height:1.8}
.hero h2{font-size:clamp(1.1rem,3.4vw,1.8rem);margin:6px 0 24px;font-weight:400}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 46px;perspective:1100px;padding:30px 0}
.book{width:140px;height:200px;position:relative;transform-style:preserve-3d;animation:sp 9s ease-in-out infinite;direction:ltr}
.book:nth-child(2){animation-delay:-2s}.book:nth-child(3){animation-delay:-4s}.book:nth-child(4){animation-delay:-6s}
.book>i{position:absolute;display:block}
.f,.k{inset:0}.f{background-size:100% 100%;transform:translateZ(14px);box-shadow:0 20px 40px #0008}.k{background:#111;transform:translateZ(-14px)}
.s{width:28px;height:100%;left:-14px;background:linear-gradient(90deg,#222,#555);transform:rotateY(-90deg)}
.p{width:28px;height:96%;top:2%;right:-14px;transform:rotateY(90deg);background:repeating-linear-gradient(#fff,#ddd 2px,#fff 3px)}
@keyframes sp{0%,100%{transform:rotateY(-28deg) translateY(0)}50%{transform:rotateY(28deg) translateY(-12px)}}
.big .book{width:200px;height:285px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.price-badge{display:inline-block;border:2px solid var(--gold);border-radius:14px;padding:2px 18px;margin:4px;color:var(--gold2)}
h3.sec{text-align:center;color:var(--gold);font-size:1.6rem;margin:30px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid #e8c25a55;border-radius:16px;padding:18px;text-align:center;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card .stage{padding:10px 0 4px}.card .book{width:110px;height:158px;animation-duration:7s}
.card h4{margin:6px 0;color:var(--gold)}.card p{font-size:.88rem;margin:4px 0 10px;opacity:.92}
.pr{font-size:1.3rem;font-weight:700;margin:6px 0}
.qty{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;direction:ltr}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:1.1rem}
.pkg{background:linear-gradient(135deg,#143a9c,#0a1f5c);border:2px solid var(--gold);border-radius:22px;text-align:center;padding:20px;margin-top:20px}
.pkg .old{text-decoration:line-through;opacity:.6}.pkg .new{font-size:2.4rem;color:var(--gold);font-weight:700}
.why{background:#ffffff10;border-radius:16px;padding:18px;margin-top:26px;text-align:center}
.ft{text-align:center;padding:26px 10px;opacity:.85;font-size:.9rem}
.wa{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:30px;padding:8px 18px;text-decoration:none;z-index:15;font-weight:700;direction:ltr}
#dr{position:fixed;top:0;bottom:0;right:0;width:min(380px,92vw);background:#06133b;border-left:2px solid var(--gold);z-index:40;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;transform:translateX(105%);transition:.35s;overflow:auto}
#dr.o{transform:none}
.ln{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #fff3;padding:8px 0;gap:8px}
.ln button{background:none;border:0;color:#ff8a8a;font-size:1.2rem}
.tot{font-size:1.3rem;color:var(--gold);margin:12px 0}
.hint{font-size:.82rem;background:#e8c25a22;border-radius:10px;padding:6px 10px;margin:8px 0}
.cb b{background:var(--gold);color:#0a1f5c;border-radius:50%;padding:0 7px;margin:0 4px}
</style></head><body>
